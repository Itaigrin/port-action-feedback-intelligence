# Theme values mirror the mockup tokens in src/ui/theme.py.
#
# This matters for more than tidiness. Clicking a query-parameter link reloads
# the page, and for a moment Streamlit paints its own theme before the injected
# stylesheet applies. When these colours disagreed with the mockup the reload
# flashed a different background, which read as the page breaking.
[theme]
base = "light"

primaryColor = "#2764e7"
backgroundColor = "#f3f6fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#182330"
linkColor = "#2764e7"
borderColor = "#e2e8f0"

redColor = "#c43e3e"
orangeColor = "#aa6100"
greenColor = "#087b61"
blueColor = "#2764e7"
grayColor = "#64748b"

[server]
headless = true

[browser]
gatherUsageStats = false
