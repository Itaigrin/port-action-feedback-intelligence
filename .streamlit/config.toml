[theme]
base = "light"

# Lightly Port-inspired: indigo primary on a clean neutral canvas.
primaryColor = "#5B4EE8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#1B1C31"
linkColor = "#5B4EE8"
borderColor = "#E3E5ED"

redColor = "#D64550"
orangeColor = "#E08A2E"
greenColor = "#2E9E6B"
blueColor = "#3B82C4"
grayColor = "#6B6F8A"

# Used by the two charts. Indigo leads so the ranking reads left to right.
chartCategoricalColors = ["#5B4EE8", "#7A6FF0", "#9A93F5", "#3B82C4", "#2E9E6B", "#E08A2E", "#6B6F8A"]

[server]
headless = true

[browser]
gatherUsageStats = false
